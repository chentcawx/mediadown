[package]
name = "media-down"
version = "0.1.0"
description = "MediaDown - MSE media stream capture & downloader"
edition = "2021"
rust-version = "1.77"

[lib]
name = "media_down_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "net", "fs"] }
reqwest = { version = "0.12", features = ["stream", "blocking"] }
base64 = "0.22"
url = "2"
