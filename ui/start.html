<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MediaDown 浏览器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #e9ebee;
    font: 14px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #3d4450;
    user-select: none;
  }
  .wrap { text-align: center; max-width: 420px; padding: 24px; }
  .icon { font-size: 46px; margin-bottom: 12px; }
  h2 { font-size: 18px; margin-bottom: 8px; color: #232830; }
  p { color: #6a7180; font-size: 13px; }
  .steps {
    margin-top: 18px;
    background: #fff;
    border: 1px solid #d9dde3;
    border-radius: 10px;
    padding: 14px 18px;
    text-align: left;
    font-size: 13px;
  }
  .steps div { padding: 4px 0; }
  .steps b { color: #2f7fe0; }
  .tips { margin-top: 14px; font-size: 12px; color: #8a91a0; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="icon">🕵️</div>
    <h2>媒体嗅探已就绪</h2>
    <p>在左侧控制台输入网址，即可在此浏览页面并自动捕获媒体流。</p>
    <div class="steps">
      <div>1️⃣ 在左侧 <b>地址栏</b> 输入目标网站地址并回车</div>
      <div>2️⃣ 页面中的 <b>视频 / 音频</b> 会被自动识别为 MSE 轨道</div>
      <div>3️⃣ 在控制台点击 <b>开始下载</b>，文件边下边存</div>
      <div>4️⃣ 播放结束后点击 <b>收尾为 MP4</b> 生成标准文件</div>
    </div>
    <div class="tips">直链媒体（.mp4 / .m3u8 等）也会在左侧「直链媒体」中列出，可一键下载。</div>
  </div>
</body>
</html>
